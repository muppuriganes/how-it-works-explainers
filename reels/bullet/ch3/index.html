<!doctype html>
<html><head><meta charset="utf-8"><title>Bullet Ch3 The power</title>
<link rel="stylesheet" href="../../../lib/fonts.css">
<link rel="stylesheet" href="../../../lib/explainer.css">
<style>
.bg{position:absolute;inset:0}
.serif{font-family:Garamond;font-style:italic;font-weight:500}
.lbl{position:absolute;font-family:Archivo;font-weight:900;font-stretch:68%;line-height:.86;letter-spacing:-0.01em;text-transform:uppercase}
.no{position:absolute;padding:10px 22px;border:7px solid #E0324B;border-radius:14px;color:#E0324B;background:rgba(255,255,255,.92);font-family:Archivo;font-weight:900;font-stretch:72%;font-size:54px;text-transform:uppercase;white-space:nowrap}
</style>
<script src="../../../lib/vendor/gsap.min.js"></script>
<script src="../../../lib/vendor/DrawSVGPlugin.min.js"></script>
<script src="../../../lib/vendor/SplitText.min.js"></script>
<script src="../../../lib/vendor/MorphSVGPlugin.min.js"></script>
<script src="../../../lib/vendor/CustomEase.min.js"></script>
<script src="../../../lib/vendor/MotionPathPlugin.min.js"></script>
<script src="words.js"></script>
<script src="../../../lib/reel.js"></script>
<script src="../../../lib/explainer.js"></script>
<script src="../../../lib/paper.js"></script><script src="../../../lib/cast.js"></script>
<script src="../../../lib/iso.js"></script>
<script src="../../../lib/explainer2.js"></script>
<script src="../../../lib/journey.js"></script>
</head><body>
<div id="shake"><div id="bgfx"></div><div id="stage">

  <!-- S1: no engine, no diesel, no smoke -->
  <section class="scene" id="s1">
    <div class="bg" style="background:linear-gradient(180deg,#FFE9D6 0%,#FFF5EA 64%,#EAD3B5 64%,#E2C7A4 100%)"></div>
    <div id="smoke" class="abs" style="inset:0"></div>
    <div id="loco" class="abs" data-ob="loco" style="left:520px;top:390px"></div>
    <div class="lbl x3d" id="s1t" data-ob="s1t" style="left:100px;top:110px;font-size:110px;--xf:#fff">No engine <span style="color:#F0566E">up front?</span></div>
    <div class="no" id="n1" data-ob="n1" style="left:150px;top:820px;transform:rotate(-6deg)">✗ Engine</div>
    <div class="no" id="n2" data-ob="n2" style="left:770px;top:820px;transform:rotate(4deg)">✗ Diesel</div>
    <div class="no" id="n3" data-ob="n3" style="left:1380px;top:820px;transform:rotate(-3deg)">✗ Smoke</div>
  </section>

  <!-- S2: real 3D — the pantograph on the wire -->
  <section class="scene" id="s2">
    <canvas id="c3" width="1920" height="1080" style="position:absolute;left:0;top:0;width:1920px;height:1080px"></canvas>
    <svg id="spark" class="abs" style="left:0;top:0;overflow:visible" width="80" height="80" viewBox="-40 -40 80 80"><g stroke="#FFE27A" stroke-width="5" stroke-linecap="round"><path d="M0 -30 L0 -12"/><path d="M26 -16 L10 -6"/><path d="M-26 -16 L-10 -6"/><path d="M20 20 L8 8"/><path d="M-20 20 L-8 8"/></g><circle r="9" fill="#fff" stroke="#FFC93D" stroke-width="5"/></svg>
    <div class="lbl x3d" id="volts" data-ob="volts" data-bleed style="left:100px;top:120px;font-size:150px;--xf:#F5A524">25,000 volts</div>
    <div class="chip" id="above" data-ob="above" style="left:110px;top:372px;color:#1B2340;font-size:28px">THE POWER HANGS ABOVE YOU ↑</div>
  </section>

  <!-- S3: the pantograph explained -->
  <section class="scene" id="s3">
    <div class="bg" style="background:linear-gradient(180deg,#CFEAFB 0%,#EAF6FD 100%)"></div>
    <div id="cl3" class="abs" style="inset:0"></div><div id="spd3" class="abs" style="inset:0"></div><svg class="abs" style="left:0;top:0" width="1920" height="1080"><rect x="140" y="150" width="26" height="720" fill="#5C677E"/><rect x="140" y="236" width="380" height="16" fill="#5C677E"/><rect x="140" y="346" width="300" height="12" fill="#5C677E"/><path d="M166 250 L 300 346" stroke="#5C677E" stroke-width="8"/></svg><svg id="wireSvg" class="abs" style="left:0;top:0;overflow:visible" width="1920" height="1080"></svg><div id="glow3" class="abs" style="left:790px;top:258px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.95) 0%,rgba(255,201,61,.45) 35%,rgba(255,201,61,0) 70%)"></div>
    <svg id="panto" class="abs" data-ob="panto" style="left:560px;top:300px;overflow:visible" width="800" height="560" viewBox="0 0 800 560"></svg>
    <div class="lbl x3d" id="s3t" data-ob="s3t" style="left:100px;top:110px;font-size:96px;--xf:#fff">The <span style="color:#12A4C4">pantograph</span></div>
    <div class="chip" id="push" data-ob="push" style="left:1400px;top:520px;color:#1F9D5A;font-size:30px">↑ SPRING PRESSES UP</div>
    <div class="chip" id="never" data-ob="never" style="left:1400px;top:300px;color:#B9770E;font-size:30px">300 KM/H · NEVER LETS GO</div>
  </section>

  <!-- S4: no single locomotive -->
  <section class="scene" id="s4">
    <div class="bg" style="background:linear-gradient(180deg,#E3DCFA 0%,#F1EDFD 70%,#D3C8F6 70%,#C9BCF2 100%)"></div>
    <div class="lbl x3d" id="s4t" data-ob="s4t" style="left:100px;top:110px;font-size:96px;--xf:#fff">No single <span style="color:#7B61FF">locomotive</span></div>
    <div id="old" class="abs" data-ob="train" style="left:120px;top:430px;width:1700px;height:260px"></div>
    <div id="newT" class="abs" data-ob="train2" style="left:120px;top:440px;width:1700px;height:250px"></div>
    <div class="chip" id="allWork" data-ob="allwork" style="left:130px;top:250px;color:#E0324B;font-size:28px">1 LOCO DOES ALL THE WORK</div>
    <div class="chip" id="every" data-ob="every" style="left:130px;top:250px;color:#1F9D5A;font-size:28px">MOTORS IN THE COACHES · ALL PUSH</div>
    <div class="pcard" id="tug" data-ob="tug" style="left:110px;top:716px;width:700px"><div class="tape"></div><div id="tugArt"></div><div class="serif" style="font-size:34px;color:#1B2340;margin-top:4px">tug of war, where everyone actually pulls</div></div>
  </section>

</div></div>
<script type="module">
import { trainWorld } from "../../../lib/train3d.js";
const { tl, W, sfx, rng } = REEL;
const { $, $$, w, show, every, pop, rise, draw } = EX;
const { ART } = PAPER;
EX.coachStart(3, 7, "The power");
const T = { s2: w("the power hangs") - 0.15, s3: w("on the roof") - 0.2, s4: w("and here's") - 0.2, close: W.last() + 0.9 };
const END = T.close + 0.9;
// chunky old diesel loco (side view, facing right)
const LOCO = (sweat = false) => `<svg width="780" height="300" viewBox="0 0 780 300" style="overflow:visible"><ellipse cx="390" cy="292" rx="380" ry="10" fill="#1B2340" opacity=".15"/>
  <defs><linearGradient id="lg${sweat ? 1 : 0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB4E8"/><stop offset="1" stop-color="#3E6FC2"/></linearGradient></defs>
  <rect x="40" y="110" width="660" height="150" rx="14" fill="url(#lg${sweat ? 1 : 0})"/><rect x="520" y="40" width="200" height="220" rx="16" fill="#2F5BB0"/><rect x="560" y="70" width="120" height="80" rx="10" fill="#BFE3F7"/>
  <rect x="140" y="56" width="50" height="60" fill="#2A3350"/><rect x="128" y="44" width="74" height="18" rx="5" fill="#1B2340"/>
  <rect x="40" y="200" width="680" height="16" fill="#F5A524"/>${[110, 200, 470, 560].map((x) => `<circle cx="${x}" cy="266" r="26" fill="#2A3350"/><circle cx="${x}" cy="266" r="9" fill="#9AA3B4"/>`).join("")}
  ${sweat ? `<g fill="#7cc7f5"><path d="M640 54 q8 14 0 22 q-8 -8 0 -22z"/><path d="M690 60 q8 14 0 22 q-8 -8 0 -22z"/></g><circle cx="600" cy="110" r="7" fill="#1B2340"/><circle cx="645" cy="110" r="7" fill="#1B2340"/><path d="M596 132 Q620 122 646 132" stroke="#1B2340" stroke-width="5" fill="none"/>` : ""}</svg>`;

// ================================================= S1: no engine / diesel / smoke
show("#s1", 0, T.s2 + 0.3, { y: 0 });
$("#loco").innerHTML = LOCO();
const puffs = Array.from({ length: 6 }, (_, i) => { const el = document.createElement("div"); el.className = "abs pf"; el.style.cssText = "left:640px;top:380px"; el.innerHTML = ISO.cloud({ w: 160 + i * 20, color: "#9AA3B4", o: 0.8 }); $("#smoke").appendChild(el); return el; });
REEL.onFrame((t) => {
  if (t > T.s2 + 0.4) return;
  const gone = Math.max(0, Math.min(1, (t - w("no smoke")) / 0.4));
  puffs.forEach((p, i) => { const u = ((t * 0.7 + i / 6) % 1); p.style.transform = `translate(${-u * 520}px, ${-u * 300}px) scale(${0.5 + u})`; p.style.opacity = (1 - u) * (1 - gone); });
});
gsap.set(["#s1t", "#n1", "#n2", "#n3"], { autoAlpha: 0 });
rise("#s1t", w("there's no"));
[["#n1", w("no engine")], ["#n2", w("no diesel")], ["#n3", w("no smoke")]].forEach(([id, t]) => { tl.fromTo(id, { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t); sfx(t + 0.14, "stamp", { gain: 0.4 }); });
tl.to("#loco", { filter: "grayscale(1) opacity(.55)", duration: 0.4 }, w("no engine") + 0.2);

// ================================================= S2: 3D close-up of the pantograph on the wire
EX.passBy(T.s2);
show("#s2", T.s2, T.s3 + 0.4, { y: 0 });
const W3 = trainWorld($("#c3"), { cars: 5 });
const V = new W3.THREE.Vector3();
REEL.onFrame((t) => {
  if (t < T.s2 - 0.1 || t > T.s3 + 0.5) return;
  const u = t - T.s2, x = 300 + u * 89, px = x - 62.5, k = Math.min(1, u / 5);
  W3.frame({ x, cam: [px + 11 - 3 * k, W3.H + 1.2 + 0.6 * k, 8.5 - 2 * k], look: [px - 1, W3.H + 1.4, 0], fov: 40, mood: "night" });
  V.set(px - 0.02, W3.H + 1.98, 0).project(W3.camera);
  const sx = (V.x * 0.5 + 0.5) * 1920, sy = (-V.y * 0.5 + 0.5) * 1080;
  $("#spark").style.transform = `translate(${sx - 40}px, ${sy - 40}px) scale(${0.6 + 0.6 * Math.abs(Math.sin(t * 37))}) rotate(${(t * 900) % 360}deg)`;
  $("#spark").style.opacity = Math.sin(t * 23) > -0.2 ? 1 : 0.2;
});
gsap.set(["#volts", "#above"], { autoAlpha: 0 });
pop("#above", w("above you") - 0.2, { sfx: "tick", gain: 0.2 });
tl.fromTo("#volts", { autoAlpha: 0, scale: 1.7, rotation: -5 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)", immediateRender: false }, w("twenty five"));
sfx(w("twenty five"), "glitch", { gain: 0.15 }); sfx(w("volts"), "impact", { gain: 0.25 });
every(w("volts"), T.s3, 0.18, (t) => tl.to("#volts", { opacity: 0.75, duration: 0.04, yoyo: true, repeat: 1 }, t));

// ================================================= S3: the pantograph explained (electric flash)
EX.iris("#s3", T.s3, 960, 300, { color: "#F5A524" });
show("#s3", T.s3, T.s4 + 0.02, { y: 0 });
// roof + single-arm pantograph, wire racing past overhead
$("#panto").innerHTML = `
  <rect x="-560" y="430" width="1920" height="130" fill="url(#roofG)"/><defs><linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D0DC"/></linearGradient></defs>
  <rect x="-560" y="520" width="1920" height="16" fill="#2F6FE0"/>
  <rect x="180" y="400" width="440" height="40" rx="12" fill="#2A3350"/>
  <path id="coil" d="M250 400 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16" stroke="#F5A524" stroke-width="7" fill="none"/>
  <g id="arm"><path d="M300 400 L520 230 L330 70" stroke="#5C677E" stroke-width="16" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="520" cy="230" r="14" fill="#2A3350"/><rect x="230" y="52" width="200" height="22" rx="8" fill="#1B2340"/></g>
  <path id="upArrow" d="M720 400 L720 120 M690 160 L720 120 L750 160" stroke="#1F9D5A" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
$("#wireSvg").innerHTML = `<line x1="0" y1="358" x2="1920" y2="358" stroke="#1B2340" stroke-width="7"/><line x1="0" y1="250" x2="1920" y2="250" stroke="#3B4566" stroke-width="5"/><g id="droppers">${Array.from({ length: 22 }, (_, i) => `<line x1="${i * 120}" y1="250" x2="${i * 120}" y2="358" stroke="#3B4566" stroke-width="3"/>`).join("")}</g>
  <g id="sp3" transform="translate(790 352)"><g stroke="#FFC93D" stroke-width="6" stroke-linecap="round"><path d="M0 -10 L0 -34"/><path d="M18 -8 L34 -22"/><path d="M-18 -8 L-34 -22"/></g><circle r="10" fill="#fff" stroke="#FFC93D" stroke-width="5"/></g>`;
REEL.onFrame((t) => { if (t < T.s3 - 0.5 || t > T.s4 + 0.5) return; $("#droppers").setAttribute("transform", `translate(${-((t * 2200) % 120)} 0)`); $("#sp3").style.opacity = Math.sin(t * 29) > 0 ? 1 : 0.3; });
gsap.set(["#s3t", "#push", "#never", "#upArrow", "#sp3", "#glow3"], { autoAlpha: 0 });
(function () { const r = rng(31); for (let i = 0; i < 4; i++) { const el = document.createElement("div"); el.className = "abs"; el.style.cssText = `left:${300 + r() * 1400}px;top:${120 + r() * 100}px`; el.innerHTML = ISO.cloud({ w: 180 + r() * 120 }); $("#cl3").appendChild(el); } })();
$("#spd3").innerHTML = Array.from({ length: 10 }, (_, i) => `<div class="abs s3l" style="left:0;top:${420 + (i * 47) % 260}px;width:${200 + (i % 3) * 80}px;height:4px;border-radius:2px;background:#fff;opacity:.75"></div>`).join("");
REEL.onFrame((t) => { if (t < T.s3 - 0.5 || t > T.s4 + 0.5) return; $$("#spd3 .s3l").forEach((el, i) => { el.style.transform = `translateX(${2200 - ((t * (2600 + i * 200) + i * 400) % 2600)}px)`; }); $("#glow3").style.transform = `scale(${0.8 + 0.35 * Math.abs(Math.sin(t * 13))})`; });
tl.to("#glow3", { autoAlpha: 1, duration: 0.2 }, w("against that"));
rise("#s3t", T.s3 + 0.35);
tl.fromTo("#arm", { scaleY: 0.25, transformOrigin: "300px 400px" }, { scaleY: 1, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, w("springy arm"));
sfx(w("springy arm"), "bloop", { gain: 0.2 });
tl.to("#upArrow", { autoAlpha: 1, duration: 0.01 }, w("presses up"));
draw("#upArrow", w("presses up"), 0.4);
pop("#push", w("presses up") + 0.2, { sfx: "pop", gain: 0.15 });
tl.to("#sp3", { autoAlpha: 1, duration: 0.1 }, w("against that"));
sfx(w("against that"), "glitch", { gain: 0.1 });
pop("#never", w("without letting"), { sfx: "chime", gain: 0.18 });
for (let k = 0; k < 10; k++) tl.to("#coil", { scaleY: k % 2 ? 1 : 0.85, transformOrigin: "50% 100%", duration: 0.12 }, w("sliding") + k * 0.13);

// ================================================= S4: no single locomotive (a train streaks the other way)
EX.passBy(T.s4, { dir: -1 });
show("#s4", T.s4, null, { y: 0 });
const coach = (x, c) => `<g transform="translate(${x} 0)"><rect x="0" y="110" width="300" height="150" rx="12" fill="${c}"/>${[0, 1, 2, 3, 4].map((i) => `<rect x="${24 + i * 54}" y="140" width="36" height="34" rx="6" fill="#1E2A48"/>`).join("")}<circle cx="60" cy="266" r="20" fill="#2A3350"/><circle cx="240" cy="266" r="20" fill="#2A3350"/></g>`;
$("#old").innerHTML = `<svg width="1700" height="300" viewBox="0 0 1700 300" style="overflow:visible">${coach(0, "#C9B6E4")}${coach(320, "#C9B6E4")}${coach(640, "#C9B6E4")}<path d="M960 190 L 1000 190" stroke="#1B2340" stroke-width="10"/><g transform="translate(960 -0)">${LOCO(true).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "")}</g></svg>`;
$("#newT").innerHTML = `<div style="transform:scaleX(-1);width:1700px">${ISO.bulletTrain({ w: 1700, cars: 4, id: "nt" })}</div>` + [0, 1, 2, 3].map((i) => `<div class="abs gear" style="left:${180 + i * 410}px;top:-90px"><svg width="70" height="70" viewBox="-35 -35 70 70"><g fill="#F5A524">${Array.from({ length: 8 }, (_, k) => `<rect x="-6" y="-34" width="12" height="16" rx="3" transform="rotate(${k * 45})"/>`).join("")}<circle r="22"/></g><circle r="9" fill="#fff"/></svg></div><div class="abs push" style="left:${170 + i * 410}px;top:180px;font-family:Archivo;font-weight:900;font-size:48px;color:#1F9D5A">→</div>`).join("");
$("#tugArt").innerHTML = `<svg width="620" height="98" viewBox="0 0 700 110"><path d="M20 70 L680 70" stroke="#8A5A3B" stroke-width="8"/>${[0, 1, 2, 3, 4].map((i) => `<g transform="translate(${80 + i * 120} 0) rotate(-14 0 70)"><circle cx="0" cy="22" r="16" fill="#F2C29B"/><rect x="-14" y="38" width="28" height="44" rx="10" fill="${["#3E7BFA", "#F0566E", "#22B573", "#F5A524", "#7B61FF"][i]}"/><path d="M-10 82 L-18 104 M10 82 L16 104" stroke="#1B2340" stroke-width="7" stroke-linecap="round"/></g>`).join("")}</svg>`;
gsap.set(["#s4t", "#old", "#newT", "#allWork", "#every", "#tug", ...$$("#newT .gear"), ...$$("#newT .push")], { autoAlpha: 0 });
rise("#s4t", w("there's no single") - 0.2);
tl.fromTo("#old", { autoAlpha: 1, x: -400 }, { x: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, T.s4 + 0.4);
for (let k = 0; k < 10; k++) tl.to("#old", { x: k % 2 ? 4 : -4, duration: 0.1 }, w("dragging") - 0.4 + k * 0.1);
pop("#allWork", w("dragging"), { sfx: "bloop", gain: 0.18 });
const tM = w("motors are");
(window.__trans = window.__trans || []).push([tM - 0.45, tM + 0.5]);
tl.to(["#old", "#allWork"], { autoAlpha: 0, x: -200, duration: 0.3 }, tM - 0.35);
tl.fromTo("#newT", { autoAlpha: 1, x: 900 }, { x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, tM - 0.2);
sfx(tM - 0.2, "whoosh", { gain: 0.25, dur: 0.6 });
$$("#newT .gear").forEach((g, i) => { pop(g, w("spread across") + i * 0.12, { from: 0.3, sfx: "pop", gain: 0.1 }); tl.fromTo(g, { rotation: 0 }, { rotation: 720, duration: END - tM, ease: "none", immediateRender: false }, tM); });
pop("#every", w("whole train"), { sfx: "chime", gain: 0.16 });
$$("#newT .push").forEach((p, i) => { tl.fromTo(p, { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.25, immediateRender: false }, w("pushes together") + i * 0.08); tl.to(p, { x: 24, duration: 0.3, yoyo: true, repeat: 5 }, w("pushes together") + 0.3); });
tl.fromTo("#tug", { autoAlpha: 0, y: 60, rotation: -4 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, w("like a tug"));
sfx(w("like a tug"), "paper", { gain: 0.25 });

EX.doors(T.close, { mode: "close", sign: "NEXT · COACH C4 · THE TRACK" });
REEL.finish(END);
</script>
</body></html>
