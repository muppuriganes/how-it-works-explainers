<script type="module">
import { rocketWorld } from "../../../lib/rocket3d.js";
const { tl, sfx } = REEL;
const { $, $$, w, we } = EX;
const D = R2D;
const clamp = (u) => Math.max(0, Math.min(1, u)), sm = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };

// ---------------- beats
const B = { g: w("inside the crew") - 0.3, st: w("two and a half") - 0.3, sep: w("separation") - 0.3, orb: w("a few minutes later") - 0.3, lap: w("that takes about") - 0.3, home: w("when the mission") - 0.3, glow: w("that glow") - 0.25, chute: w("then it gets quiet") - 0.3, spl: w("splash"), rec: w("from a countdown") - 0.2, fin: w("mission complete") - 0.5 };

  if (t < B.st) { const s = mm - m(B.g), th = -0.5, bp = [9000 + 400 * s, 30000 + 600 * s, 0], tp = stack(bp, th);
    const c = [tp[0] + 18, bp[1] + 12, 30]; return { t: mm, mood: "high", mood2: "space", k: 0.3, booster: { p: bp, rot: [0, 0, th], flame: 1, plumeLen: 2 }, upper: { p: tp, rot: [0, 0, th] }, pad: false, smoke: {}, cam: c, look: shift(c, [tp[0], tp[1] + 6, 0], 0.22), fov: 50, shake: 0.08 }; }
  if (t < B.sep + 0.3) { const s = mm - m(B.st), bp = [0, -STK - 6 + 3 * s, 0], tp = stack(bp, 0);
    return { t: mm, mood: "space", earthAlt: 75000, earthRot: [0.45, 1.75, 0.12], cityLights: 0, booster: { p: bp, flame: 1, plumeLen: 1.6, vac: 0.6 }, upper: { p: tp }, smoke: {}, cam: STC, look: shift(STC, [0, tp[1] - 10, 0], 0.2), fov: 46 }; }
  if (t < B.orb) { const sep0 = m(w("separation")), lt = mm - sep0, sep = Math.max(0, lt), ign = sm((mm - m(w("second engine"))) / 0.4), fo = sm((mm - m(w("nose cone")) + 0.2) / 1.1), up = 0.6 * Math.max(0, mm - m(w("second engine"))) ** 2, base0 = 3 * (sep0 - m(B.st)) - 6;
    const u = sm((t - B.sep - 0.3) / (B.orb - B.sep)), c = L3(STC, [-36, 10, 54], u);
    return { t: mm, mood: "space", earthAlt: 75000, earthRot: [0.45, 1.75, 0.12], cityLights: 0, booster: { p: [0.4 * sep, -STK + base0 - 1.25 * sep * sep, 0.3 * sep], rot: [0, 0, 0.05 * sep * sep], flame: lt < 0.3 ? 1 : 0, plumeLen: 1.6, vac: 1 }, upper: { p: [0, base0 + up, 0], flame: ign, vac: 0.8, fairing: fo * 0.9, fairingDrift: fo * fo * 6 }, smoke: {}, cam: c, look: shift(c, [0, base0 + up * 0.6, 0], L(0.2, 0, u)), fov: 46 }; }
  if (t < B.home) { const s = mm - m(B.orb), k = sm((t - B.orb) / (B.home - B.orb)), a = L(2.0, 3.3, k), r = L(26, 32, k);
    const c = [Math.cos(a) * r, L(8, 3, k), Math.sin(a) * r];
    return { t: mm, mood: "space", earthAlt: 400000, earthRot: [0.5, 1.45 + s * 0.004, 0.1], cityLights: 1.4, capsule: { p: [0, 0, 0], rot: [0.1 + s * 0.01, 0.5, 1.5] }, smoke: {}, cam: c, look: shift(c, [0, L(-4, -6, k), 0], 0.3), fov: 44 }; }
  if (t < B.glow) { const u = sm((t - B.home) / (B.glow - B.home)), g = sm((t - w("drops back")) / 1.2);
    return { t: mm, mood: "space", earthAlt: L(400000, 90000, u), earthRot: [0.5, L(1.6, 1.95, u), 0.1], cityLights: 0.6, capsule: { p: [0, 0, 0], rot: L3([0.1, 0.5, 1.5], [0, 0, -1.0], sm((t - B.home) / 3.5)), glow: g }, smoke: {}, cam: L3([24, 8, 34], [-26.3, 2, 41.2], u), look: [L(0, 8, u), L(-2, 6, u), 0], fov: 44, shake: 0.08 * g }; }
  if (t < B.chute) { const a = L(-0.2, 0.5, sm((t - B.glow) / (B.chute - B.glow))), c = [Math.sin(a) * 42 - 18, 2, Math.cos(a) * 42];
    return { t: mm, mood: "space", earthAlt: 80000, earthRot: [0.5, 1.95, 0.1], cityLights: 0, capsule: { p: [0, 0, 0], rot: [0, 0, -1.0 + Math.sin(mm * 3) * 0.03], glow: 0.85 + 0.15 * Math.sin(mm * 7) }, smoke: {}, cam: c, look: shift(c, [7, 6, 0], 0.22), fov: 44, shake: 0.12 * (1 - frz(t)) }; }
  const sea = { amp: 1, foam: foam(t) }, splA = t - B.spl;

  if (t < B.spl) return { t: mm, mood: "day", sea, capsule: cap, boat: { p: [X + 260, 0, -340], yaw: 2.3 }, pad: false, smoke: {}, cam: L3([X + 70, 7, 64], [X + 46, 4.5, 40], sm((t - B.chute) / (B.spl - B.chute))), look: [X, L(70, 6, sm((t - B.chute) / (B.spl - B.chute))), 0], fov: 40 };
  if (t < B.rec) return { t: mm, mood: "day", sea, capsule: cap, boat: { p: [X + 200, 0, -260], yaw: 2.4 }, pad: false, smoke: { splash: [X, 0, 0, splA] }, cam: [X + 26, 4, 30], look: [X, 2, 0], fov: 44 };
  const u = sm((t - B.rec) / (B.fin - B.rec)), bx = L(X + 150, X + 40, u);
  return { t: mm, mood: "day", sea, capsule: { ...cap, rot: [0.05, 0.4, 0.03] }, boat: { p: [bx, 0, -70 + 20 * u], yaw: 2.6 }, pad: false, smoke: { splash: [X, 0, 0, splA] }, cam: L3([X - 24, 5, 36], [X - 19, 4, 29], u), look: [X + 6, 2, -4], fov: 44 };
}

// ---------------- 2D cards
$("#pMq").innerHTML = D.squeeze({ id: "mq" }); $("#pGs").innerHTML = D.gseat({ id: "gs" }); $("#pDw").innerHTML = D.deadweight({ id: "dw" });
$("#pLd").innerHTML = D.landing({ id: "ld" }); $("#pNc").innerHTML = D.cannon({ id: "nc" }); $("#pLp").innerHTML = D.lap({ id: "lp" });
$("#pSn").innerHTML = D.suns({ id: "sn" }); $("#pFl").innerHTML = D.floaty({ id: "fl" }); $("#pHt").innerHTML = D.heat({ id: "ht" });
$("#rc").innerHTML = D.recap({ w: 1400, id: "rc" }); $("#cha").innerHTML = D.chai({ w: 130, id: "ch" });
const PAN = [["#pMq", 1.6, B.g - 0.3, 1], ["#pGs", B.g + 0.3, B.st - 0.4, -1], ["#pDw", FR[1][0] + 0.2, B.sep + 0.1, 1], ["#pLd", w("and that first") - 0.2, B.orb - 0.5, -1], ["#pNc", FR[2][0] + 0.4, B.lap - 0.1, 1], ["#pLp", B.lap + 0.2, w("so the crew") - 0.3, 1], ["#pSn", w("so the crew") - 0.1, w("and they float") - 0.3, 1], ["#pFl", w("and they float") - 0.1, B.home - 0.4, 1], ["#pHt", B.glow + 0.4, B.chute - 0.7, 1]];
gsap.set([...PAN.map((p) => p[0]), "#rc", "#cha", "#fin", "#fT", "#fS", "#fB", ...$$("#rc g[id^=rcI]")], { autoAlpha: 0 });
PAN.forEach(([el, a, b, d]) => { tl.fromTo(el, { autoAlpha: 0, x: 70 * d, rotation: 3 * d, scale: 0.92 }, { autoAlpha: 1, x: 0, rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)", immediateRender: false }, a); tl.to(el, { autoAlpha: 0, x: 50 * d, scale: 0.95, duration: 0.3, ease: "power2.in" }, b); sfx(a, "whoosh", { gain: 0.08, dur: 0.4 }); sfx(a + 0.25, "pop", { gain: 0.1 }); });

REEL.onFrame((t) => {
  if (t < B.g + 0.5) { const e = sm((t - w("ease back") + 0.2) / 0.5) * (1 - sm((t - w("full power") + 0.2) / 0.5)), ang = L(0.7, -1.2, e); $("#mqN").setAttribute("x2", (52 * Math.sin(ang)).toFixed(1)); $("#mqN").setAttribute("y2", (-52 * Math.cos(ang)).toFixed(1)); $("#mqAir").setAttribute("transform", `translate(0 ${(Math.sin(t * 10) * 4).toFixed(1)})`); }
  if (t > B.g && t < B.st + 0.5) { const k = sm((t - w("pressed into") + 0.1) / 0.6), b = Math.sin(t * 6) * 2 * k; $("#gsBody").setAttribute("transform", `translate(0 ${(18 * k + b).toFixed(1)}) translate(290 300) scale(${(1 + 0.05 * k).toFixed(3)} ${(1 - 0.12 * k).toFixed(3)}) translate(-290 -300)`); $("#gsKb").setAttribute("transform", `translate(0 ${(-200 * (1 - sm((t - w("pressed into") + 0.4) / 0.5)) + 18 * k).toFixed(1)})`); }
  if (t > B.st && t < B.sep + 0.5) { const k = sm((t - w("lets it go") + 0.1) / 1.0); $("#dwTank").setAttribute("transform", `translate(${(-40 * k).toFixed(1)} ${(300 * k * k).toFixed(1)}) rotate(${(-35 * k).toFixed(1)} 250 300)`); $("#dwFl").setAttribute("opacity", k > 0.3 ? 1 : 0); }
  if (t > B.sep && t < B.orb + 0.5) { const k = clamp((t - w("fly it back") + 0.1) / 4.4), e = sm(k), x = L(110, 400, e), y = 306 - 250 * Math.sin(Math.PI * Math.min(1, e * 1.02)) * (1 - e * 0.25), rot = L(200, 0, sm(k * 1.7 - 0.25)); $("#ldB").setAttribute("transform", `translate(${x.toFixed(1)} ${Math.min(306, y).toFixed(1)}) rotate(${rot.toFixed(1)})`); $("#ldLeg").setAttribute("opacity", k > 0.62 ? 1 : 0); $("#ldF").setAttribute("opacity", k > 0.5 && k < 0.99 ? 1 : 0); $("#ldPuff").setAttribute("opacity", (k > 0.95 ? Math.max(0, 1 - (t - (w("fly it back") + 4.3)) / 1.5) : 0).toFixed(2)); }
  if (t > B.orb && t < B.lap + 0.5) { const P = [[$("#ncP0"), w("and it falls") - 0.3, 0.9], [$("#ncP1"), w("lands farther") - 0.4, 1.0], [$("#ncP2"), w("curves away") - 0.5, 3.4]]; let ball = null; P.forEach(([p, a, d]) => { const k = sm((t - a) / d), Lp = p.getTotalLength(); p.style.strokeDasharray = `${(Lp * k).toFixed(1)} ${Lp}`; if (t >= a) ball = p.getPointAtLength(Lp * k); }); const b = $("#ncBall"); b.setAttribute("cx", ball ? ball.x.toFixed(1) : 338); b.setAttribute("cy", ball ? ball.y.toFixed(1) : 56); }
  if (t > B.lap && t < B.home) { const a = ((t - B.lap) / 3.2) * Math.PI * 2; $("#lpDot").setAttribute("transform", `translate(${(300 + 230 * Math.cos(a)).toFixed(1)} ${(200 + 80 * Math.sin(a)).toFixed(1)})`); $("#lpDot").setAttribute("opacity", Math.sin(a) < -0.15 && Math.abs(Math.cos(a)) < 0.45 ? 0.25 : 1);
    const sr = (t - (w("so the crew") - 0.1)) / 2.6, n = Math.max(1, Math.min(16, Math.floor(sm(sr) * 16) + 1)), ph = (sm(sr) * 16) % 1; $("#snN").textContent = n; $("#snSun").setAttribute("transform", `translate(0 ${(130 - 150 * Math.sin(Math.PI * Math.min(1, ph))).toFixed(1)})`);
    $("#flAst").setAttribute("transform", `translate(${(230 + Math.sin(t * 1.3) * 22).toFixed(1)} ${(200 + Math.sin(t * 0.9) * 26).toFixed(1)}) rotate(${(Math.sin(t * 0.7) * 16).toFixed(1)}) scale(1.35)`); $("#flPen").setAttribute("transform", `translate(${(360 + Math.sin(t * 1.1) * 20).toFixed(1)} ${(260 + Math.cos(t * 0.8) * 16).toFixed(1)}) rotate(${(t * 40 % 360).toFixed(1)})`); $("#flCup").setAttribute("transform", `translate(${(110 + Math.cos(t * 0.9) * 14).toFixed(1)} ${(120 + Math.sin(t * 1.2) * 18).toFixed(1)}) rotate(${(Math.sin(t) * 25).toFixed(1)})`); }
  if (t > B.glow && t < B.chute + 0.5) { const k = sm((t - B.glow - 0.5) / 3); $$(".htd").forEach((d, i) => { const col = i % 6, row = Math.floor(i / 6); d.setAttribute("cx", (30 + col * 22 + k * (150 - col * 12) + Math.sin(t * 12 + i) * 2).toFixed(1)); d.setAttribute("cy", (60 + row * 64 + (200 - (60 + row * 64)) * k * 0.4).toFixed(1)); d.setAttribute("fill", k > 0.6 ? "#FFB45A" : "#9FD7FF"); }); const h = sm((t - w("incredibly hot") + 0.3) / 1.8); $("#htGlow").setAttribute("opacity", (0.15 + 0.85 * h).toFixed(2)); $("#htTh").setAttribute("height", (218 * h).toFixed(1)); $("#htTh").setAttribute("y", (6 + 218 * (1 - h)).toFixed(1)); $("#htT").textContent = `${Math.round(1500 * h / 10) * 10 >= 1000 ? Math.floor(Math.round(1500 * h / 10) * 10 / 1000) + "," + String(Math.round(1500 * h / 10) * 10 % 1000).padStart(3, "0") : Math.round(1500 * h / 10) * 10} °C`; [0, 1, 2].forEach((i) => $(`#htL${2 - i}`).setAttribute("opacity", t > w("layer by layer") + i * 0.35 ? 0.12 : 1)); }

[w("from a countdown") + 0.2, w("the sky"), w("to space"), w("space and back") + 0.3, w("back in")].forEach((tt, i) => { tl.fromTo(`#rcI${i}`, { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, tt); sfx(tt, "pop", { gain: 0.14, pitch: 1 + i * 0.1 }); });
tl.to("#rc", { autoAlpha: 0, duration: 0.4 }, w("and yes") - 0.2);

// ---------------- finale: smoke rises, the mission board lands
