<!doctype html>
<html><head><meta charset="utf-8"><title>Rocket journey part 1</title>
<link rel="stylesheet" href="../../../lib/fonts.css">
<link rel="stylesheet" href="../../../lib/explainer.css">
<style>
#c3{position:absolute;left:0;top:0;width:1920px;height:1080px}
.pic{position:absolute;width:600px;height:420px;border-radius:34px;box-shadow:0 0 0 6px #fff,0 22px 50px rgba(0,0,0,.35);overflow:hidden;transform-origin:50% 50%}
.lab{position:absolute;font-family:Archivo,sans-serif;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(8,12,34,.55),0 0 18px rgba(8,12,34,.5)}
#clk{position:absolute;left:44px;top:36px;padding:8px 20px;border-radius:999px;background:rgba(10,16,44,.55);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.22);font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#FFC93D;letter-spacing:.04em}
#scan{position:absolute;left:0;top:0;width:150px;height:8px;border-radius:4px;background:#BDEFFB;box-shadow:0 0 26px 12px rgba(159,227,242,.8)}
#dial{position:absolute;left:1580px;top:150px;width:280px;height:280px}
.pt{position:absolute;text-align:center}
.pt .lab{position:static;font-size:30px;margin-top:6px}
</style>
<script src="../../../lib/vendor/gsap.min.js"></script>
<script src="../../../lib/vendor/DrawSVGPlugin.min.js"></script>
<script src="../../../lib/vendor/SplitText.min.js"></script>
<script src="../../../lib/vendor/MorphSVGPlugin.min.js"></script>
<script src="../../../lib/vendor/CustomEase.min.js"></script>
<script src="../../../lib/vendor/MotionPathPlugin.min.js"></script>
<script src="words.js"></script>
<script src="../../../lib/reel.js"></script>
<script src="../../../lib/explainer.js"></script>
<script src="../../../lib/explainer2.js"></script>
<script src="../../../lib/iso.js"></script>
<script src="../../../lib/rocket.js"></script>
<script src="../../../lib/rocketfx.js"></script>
<script src="../../../lib/rocket2d.js"></script>
</head><body>
<div id="shake"><div id="bgfx"></div><div id="stage">
  <canvas id="c3" width="1920" height="1080"></canvas>
  <div id="scan"></div>
  <div id="xr" class="abs" style="left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 0 18px rgba(159,227,242,.55))"></div>
  <div id="xrL" class="lab" style="left:1120px;top:92px;font-size:44px;color:#FFD27A">≈ 90% fuel</div>
  <div id="parts" class="abs" style="left:0;top:0"></div>
  <div id="rg" class="abs" style="left:0;top:0"></div>
  <div id="rgL" class="lab" style="left:0;top:0;font-size:34px">💧 water soaks up the noise</div>
  <div id="fo" class="abs" style="left:0;top:0"></div>
  <div id="bal" class="pic" style="left:80px;top:330px"></div>
  <div id="tn" class="pic" style="left:1240px;top:330px"></div>
  <svg id="dial" viewBox="0 0 280 280"><circle cx="140" cy="140" r="128" fill="rgba(8,12,34,.62)" stroke="rgba(255,255,255,.3)" stroke-width="4"/>
    <g id="dTk"></g><circle cx="140" cy="140" r="104" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14"/><circle id="dRing" cx="140" cy="140" r="104" fill="none" stroke="#FFC93D" stroke-width="14" stroke-linecap="round" transform="rotate(-90 140 140)" stroke-dasharray="653 653"/>
    <text x="140" y="110" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#9FE3F2" letter-spacing="4">T-MINUS</text>
    <text id="dN" x="140" y="196" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="100" fill="#fff">10</text></svg>
  <div id="clk">T-00:30</div>
</div></div>
<script type="module">
import { rocketWorld } from "../../../lib/rocket3d.js";
const { tl, sfx } = REEL;
const { $, $$, w, we } = EX;
const D = R2D;
const clamp = (u) => Math.max(0, Math.min(1, u)), sm = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const L = (a, b, k) => a + (b - a) * k, L3 = (a, b, k) => a.map((v, i) => L(v, b[i], k));
const STK = 45.4, TW = { mood: "dusk", mood2: "night", k: 0.5 };

// ---------------- beats
const TICK0 = window.TICK0, TK = window.TICK, TIGN = w("ignition");
const TB = w("let's look inside") - 0.2, TC = TICK0 - 0.25, TD = TICK0 + 6 * TK - 0.15;
const F0 = w("notice something") - 0.25, F1 = w("and there it goes") - 0.35, RAMP = 0.5;
const TG = w("it isn't pushing") - 0.3, TH = w("now watch") - 0.3, END = we("sideways sprint") + 0.9;
const mF = F0 + RAMP / 2;
const m = (t) => t < F0 ? t : t < F0 + RAMP ? F0 + (t - F0) - (t - F0) ** 2 / (2 * RAMP) : t < F1 ? mF : t < F1 + RAMP ? mF + (t - F1) ** 2 / (2 * RAMP) : mF + RAMP / 2 + (t - F1 - RAMP);
const frz = (t) => t < F0 ? 0 : t < F0 + RAMP ? (t - F0) / RAMP : t < F1 ? 1 : t < F1 + RAMP ? 1 - (t - F1) / RAMP : 0;
const TL = mF + 0.6, alt = (mm) => (mm < TL ? 0 : 2.5 * (mm - TL) ** 2);

const W3 = rocketWorld($("#c3"), { w: 1920, h: 1080 });
const P = (p) => W3.project(p);
const DEND = [44, 5, -40], DA = Math.atan2(DEND[2], DEND[0]), DR = Math.hypot(DEND[0], DEND[2]);
function shot(t) {
  const mm = m(t), y = 9 + alt(mm), fl = sm((mm - TIGN) / 0.6), ign = mm > TIGN;
  const base = { t: mm, ...TW, booster: { p: [0, y, 0], flame: fl, plumeLen: ign ? (mm < TL ? L(0.25, 0.55, sm((mm - TIGN) / 1.2)) : 1) : 0, light: 1.2 }, upper: { p: [0, y + STK, 0] }, arm: sm((mm - (TIGN - 4)) / 1.6) };
  const smk = { steam: mm, vent: ign ? null : [0, 50, 0], deluge: mm > w("see that water") - 0.2 ? mm - w("see that water") + 0.2 : null, liftoff: ign ? mm - TIGN : null, rocketY: y, sparks: ign ? mm - TIGN : null, fire: fl };
  if (t < TC) { const u = sm(t / (TB + 0.2)); return { ...base, smoke: smk, cam: L3([-30, 5, 230], [0, 44, 150], u), look: L3([30, 34, 0], [28, 44, 0], u), fov: 36 }; }
  if (t < TD) { const u = sm((t - TC) / (TD - TC)); return { ...base, smoke: smk, cam: L3([112, 8, 34], [96, 9, 28], u), look: [-6, L(30, 26, u), 6], fov: 42 }; }
  if (t < F0) { const u = sm((t - TD) / (F0 - TD)); return { ...base, smoke: smk, cam: L3([52, 4, -48], DEND, u), look: [0, 30, 0], fov: 46, shake: 0.12 * fl }; }
  if (t < F1 + 0.2) { const k = sm((t - F0) / (F1 - F0)), a = L(DA, DA + 1.05, k), r = L(DR, 80, k); return { ...base, smoke: smk, cam: [Math.cos(a) * r, L(5, 14, k), Math.sin(a) * r], look: [0, L(30, 32, k), 0], fov: 44, shake: 0.1 * fl * (1 - frz(t)) }; }
  if (t < TG) return { ...base, smoke: smk, cam: [-70, 30, 330], look: [0, y * 0.75 + 22, 0], fov: 26, shake: 0.04 };
  if (t < TH) { const u = (t - TG) / (TH - TG), yy = L(260, 620, u); return { ...base, booster: { ...base.booster, p: [0, yy, 0], flame: 1, plumeLen: 1.1 }, upper: { p: [0, yy + STK, 0] }, smoke: { trail: { y0: 12, y1: yy - 2, n: 420 } }, cam: [-30, yy - 30, 74], look: [12, yy + 24, 0], fov: 46, shake: 0.05 }; }
  const u = (t - TH) / (END - TH), th = L(-0.03, -0.16, sm(u)), yy = L(900, 2300, u), x = (yy - 900) * 0.14, bp = [x, yy, 0];
  return { t: mm, mood: "dusk", booster: { p: bp, rot: [0, 0, th], flame: 1, plumeLen: 1.2 }, upper: { p: [bp[0] - STK * Math.sin(th), bp[1] + STK * Math.cos(th), 0], rot: [0, 0, th] }, smoke: { trail: { y0: yy - 1400, y1: yy - 2, x0: x - 190, x1: x, n: 600 } }, pad: false, cam: [x - 55, yy - 32, 95], look: [x + 30, yy + 28, 0], fov: 44, shake: 0.05 };
}

// ---------------- 2D content
$("#xr").innerHTML = D.xray({ w: 240, id: "xr" });
const PARTS = [["engine", "engines", w("the engines")], ["tank", "tanks", w("the tanks")], ["capsule", "capsule", w("the capsule")], ["crew", "crew", w("the crew")]];
$("#parts").innerHTML = PARTS.map(([k, n], i) => `<div class="pt" id="pt${i}" style="left:${1450 + (i % 2) * 220}px;top:${280 + Math.floor(i / 2) * 270}px;width:190px">${D.part(k, { w: 160, id: "pp" + i })}<div class="lab">${n}</div></div>`).join("");
$("#rg").innerHTML = D.rings({ w: 560, id: "sr" });
$("#fo").innerHTML = D.forces({ w: 400, id: "fo" });
$("#bal").innerHTML = D.balloon({ id: "bl" });
$("#tn").innerHTML = D.turn({ id: "gt" });
$("#dTk").innerHTML = Array.from({ length: 10 }, (_, i) => { const a = (i / 10) * Math.PI * 2 - Math.PI / 2; return `<circle class="dk" cx="${(140 + Math.cos(a) * 124).toFixed(1)}" cy="${(140 + Math.sin(a) * 124).toFixed(1)}" r="5" fill="#fff" opacity=".3"/>`; }).join("");
gsap.set(["#scan", "#xr", "#xrL", ...$$(".pt"), "#rg", "#rgL", "#fo", "#bal", "#tn", "#dial"], { autoAlpha: 0 });

// x-ray: scan sweeps up the real rocket, then the cutaway pulls out of it to the right
W3.frame(shot(TB + 0.3)); const pb = P([0, 9, 0]), pt = P([0, 9 + STK + 26, 0]), rh = pb[1] - pt[1], sx = rh / 900;
const tS = TB + 0.2, tX = w("almost all") - 0.1;
tl.set("#scan", { autoAlpha: 1, x: pb[0] - 75, y: pb[1] }, tS); tl.to("#scan", { y: pt[1], duration: 1.1, ease: "power1.inOut" }, tS); tl.to("#scan", { autoAlpha: 0, duration: 0.2 }, tS + 1.1);
sfx(tS, "riser", { gain: 0.12, dur: 1.1 });
tl.fromTo("#xr", { autoAlpha: 0, x: pb[0] - 120 * sx, y: pt[1], scale: sx }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, tX - 0.4);
tl.to("#xr", { x: 1120, y: 150, scale: 0.98, duration: 0.7, ease: "power3.inOut" }, tX + 0.1);
sfx(tX + 0.1, "whoosh", { gain: 0.18 });
const FL = [["xrLoxB", 472, 146], ["xrFuelB", 630, 164], ["xrLoxU", 250, 66], ["xrFuelU", 328, 70]];
REEL.onFrame((t) => { if (t < TB || t > TC + 0.6) return; const k = sm((t - tX - 0.7) / 1.4) * 0.92; FL.forEach(([id, y0, h], i) => { const hh = h * Math.min(1, k * 1.05 - i * 0.02), wob = Math.sin(t * 5 + i) * 1.5 * (1 - k); $("#" + id).setAttribute("height", Math.max(0, hh).toFixed(1)); $("#" + id).setAttribute("y", (y0 + h - hh).toFixed(1)); $("#" + id + "S").setAttribute("cy", (y0 + h - hh + wob).toFixed(1)); $("#" + id + "S").setAttribute("opacity", hh > 3 ? 0.9 : 0); }); $("#xrBub").setAttribute("transform", `translate(0 ${(-((t * 40) % 60)).toFixed(1)})`); });
tl.fromTo("#xrL", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, immediateRender: false }, w("about ninety") - 0.1); sfx(w("about ninety"), "ding", { gain: 0.16 });
PARTS.forEach(([, , tt], i) => { tl.fromTo(`#pt${i}`, { autoAlpha: 0, x: -300, y: -160 + i * 40, scale: 0.3, rotation: -20 }, { autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)", immediateRender: false }, tt - 0.15); sfx(tt - 0.1, "pop", { gain: 0.14, pitch: 1 + i * 0.1 }); });
tl.to(["#xr", "#xrL", ...$$(".pt")], { autoAlpha: 0, duration: 0.35 }, TC - 0.45);
REEL.onFrame((t) => { if (t < TB || t > TC) return; $$(".pt").forEach((p, i) => { p.style.translate = `0 ${(Math.sin(t * 2 + i) * 5).toFixed(1)}px`; }); });

// countdown dial (no voice): ticks 10 → 0 on the right
tl.fromTo("#dial", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, TICK0 - 0.1);
tl.to("#dial", { autoAlpha: 0, scale: 1.3, duration: 0.3 }, TIGN + 0.4);
for (let i = 0; i <= 10; i++) sfx(TICK0 + i * TK, i < 10 ? "tick" : "beep", { gain: i < 10 ? 0.22 : 0.18, pitch: i < 7 ? 1 : 1.25 });
REEL.onFrame((t) => { if (t < TICK0 - 0.2 || t > TIGN + 0.8) return; const e = Math.max(0, t - TICK0), n = Math.max(0, 10 - Math.floor(e / TK)), f = (e % TK) / TK; $("#dN").textContent = n; $("#dN").setAttribute("fill", n <= 3 ? "#FF7A6A" : "#fff"); $("#dRing").setAttribute("stroke-dasharray", `${(653 * Math.max(0, (10 - e / TK) / 10)).toFixed(1)} 653`); $("#dRing").setAttribute("stroke", n <= 3 ? "#FF7A6A" : "#FFC93D"); $$(".dk").forEach((d, i) => d.setAttribute("opacity", i < 10 - n ? 0.95 : 0.3)); $("#dN").setAttribute("transform", `translate(140 160) scale(${(1 + 0.12 * Math.max(0, 1 - f * 5)).toFixed(3)}) translate(-140 -160)`); });

// water + noise rings anchored at the pad
REEL.onFrame((t) => { if (t < TC || t > TIGN + 0.4) return; const [x, y] = P([0, 10, 0]); gsap.set("#rg", { x: x - 280, y: y - 270 }); gsap.set("#rgL", { x: x - 230, y: y - 350 }); const k = sm((t - w("soaks up") + 0.2) / 1.0); [0, 1, 2, 3].forEach((i) => { const g = $(`#srR${i}`), pulse = 1 + 0.04 * Math.sin(t * 8 - i); g.setAttribute("transform", `translate(280 270) scale(${((1 - 0.55 * k * (i + 1) / 4) * pulse).toFixed(3)}) translate(-280 -270)`); g.setAttribute("opacity", (1 - 0.75 * k * i / 3).toFixed(2)); }); });
tl.fromTo("#rg", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, w("so loud") - 0.1);
tl.fromTo("#rgL", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, w("soaks up") - 0.2);
tl.to(["#rg", "#rgL"], { autoAlpha: 0, duration: 0.3 }, TIGN - 0.3);
sfx(w("see that water") - 0.2, "water", { gain: 0.24, dur: TIGN - w("see that water") + 1.5 });

// ignition + freeze: forces beside the frozen rocket
sfx(TIGN - 0.05, "rumble", { gain: 0.45, dur: F0 - TIGN + 0.6 }); REEL.shake($("#shake"), TIGN + 0.1, 8);
sfx(F0, "whoosh", { gain: 0.16, dur: 0.6 }); sfx(F0 + 0.4, "rumble", { gain: 0.07, dur: F1 - F0 - 0.2 });
REEL.onFrame((t) => { if (t < F0 || t > F1 + 0.6) return; const [x, y] = P([0, 34, 0]); gsap.set("#fo", { x: x + 110, y: y - 400 }); const k = sm((t - w("grow bigger") + 0.1) / (w("push wins") - w("grow bigger") + 0.2)); $("#foTh").setAttribute("transform", `translate(0 600) scale(1 ${(0.35 + 0.8 * k).toFixed(3)}) translate(0 -600)`); $("#foWt").setAttribute("transform", `translate(0 ${(Math.sin(t * 3) * 3).toFixed(1)})`); });
tl.fromTo("#fo", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, immediateRender: false }, w("that's because") - 0.2);
tl.to("#fo", { autoAlpha: 0, duration: 0.3 }, F1 + 0.2);
sfx(w("push wins"), "ding", { gain: 0.18 });
sfx(F1, "rumble", { gain: 0.5, dur: END - F1 }); sfx(F1, "riser", { gain: 0.14, dur: 0.5 });

// balloon card (left) while it climbs
tl.fromTo("#bal", { autoAlpha: 0, x: -60, rotation: -3 }, { autoAlpha: 1, x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, w("it throws hot") - 0.3);
REEL.onFrame((t) => { if (t < TG || t > TH + 0.5) return; const k = sm((t - w("let it go") + 0.7) / 1.3); $("#blB").setAttribute("transform", `translate(${(-180 * k).toFixed(1)} ${(Math.sin(t * 16) * 5 * k).toFixed(1)}) rotate(${(Math.sin(t * 9) * 7 * k).toFixed(1)} 236 200)`); $("#blA").setAttribute("opacity", (0.25 + 0.75 * k).toFixed(2)); $("#blA").setAttribute("transform", `translate(${(-180 * k + ((t * 160) % 48)).toFixed(1)} 0)`); $("#blR").setAttribute("transform", `translate(0 ${(-120 * sm((t - w("pushes the rocket") + 0.3) / 1.6)).toFixed(1)})`); });
tl.to("#bal", { autoAlpha: 0, x: -40, duration: 0.3 }, TH - 0.4);

// gravity-turn card (right): the mini rocket follows the path
tl.fromTo("#tn", { autoAlpha: 0, x: 60, rotation: 3 }, { autoAlpha: 1, x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, w("that's on purpose") - 0.2);
const gp = $("#gtP"), GL = gp.getTotalLength();
REEL.onFrame((t) => { if (t < TH || t > END) return; const k = sm((t - w("that's on purpose") + 0.2) / (END - w("that's on purpose") - 0.6)), p = gp.getPointAtLength(GL * k), q = gp.getPointAtLength(Math.min(GL, GL * k + 4)), a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90; $("#gtR").setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)})`); gp.style.strokeDasharray = `${(GL * k).toFixed(1)} ${GL}`; });

// transitions: steam wipe into the countdown, cloud wipes into the cloud layer and out of this part
EX.smokeWipe(TC, { seed: 5 }); EX.smokeWipe(TH, { seed: 8 }); EX.smokeWipe(END + 0.02, { seed: 21 });
sfx(TD - 0.1, "whoosh", { gain: 0.12 }); sfx(TG - 0.1, "whoosh", { gain: 0.14 });

// freeze look + mission clock
const pad = (n) => { n = Math.max(0, Math.floor(n)); return `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`; };
REEL.onFrame((t) => {
  const z = frz(t); $("#c3").style.filter = z > 0 ? `saturate(${(1 - 0.45 * z).toFixed(2)}) brightness(${(1 - 0.06 * z).toFixed(2)})` : "none";
  const mm = m(t); let s;
  if (z > 0.5) s = "⏸ TIME HELD"; else if (t < TICK0) s = `T-${pad(10 + (TICK0 - t) * 20 / TICK0 + 0.999)}`; else if (mm < TIGN) s = `T-${pad(Math.max(0, 10 - Math.floor((t - TICK0) / TK)))}`;
  else if (t < TG) s = `T+${pad(mm - TIGN)}`; else if (t < TH) s = `T+${pad(14 + (t - TG) * 1.5)}  ▶▶×2`; else s = `T+${pad(28 + (t - TH) * 2)}  ▶▶×2`;
  $("#clk").textContent = s; $("#clk").style.color = z > 0.5 ? "#9FE3F2" : "#FFC93D";
  W3.frame(shot(t));
});
REEL.finish(END);
</script></body></html>
