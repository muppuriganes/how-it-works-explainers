<script>
const { tl, W, sfx, rng } = REEL;
const { $, $$, w, we, pop, rise, fade, hide, draw, SVG, chip } = EX;
EX.chrome(1, 7, "One hello");
EX.subtitles();
const END = W.last() + 1.8;
const T = {
  s2: w("a few seconds") - 0.05,
  s3: w("and when your") - 0.25,
  s4a: w("in that tiny") - 0.15,
  s4b: w("moment") + 0.35,
  s5: w("let's follow") - 0.2,
};
tl.to(["#tag", "#prog"], { autoAlpha: 1, duration: 0.5 }, 0.2);
tl.to(["#tag", "#prog"], { autoAlpha: 0, duration: 0.3 }, T.s4a);
const show = (id, a, b, from = {}) => {
  tl.set(id, { autoAlpha: 0 }, 0);
  tl.fromTo(id, Object.assign({ autoAlpha: 0 }, from), { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, a);
  if (b != null) tl.set(id, { autoAlpha: 0 }, b);
};

// ================================================= S1: open, tap, call
show("#s1", 0, T.s2 + 0.6);
// floating app icons (bokeh)
(function () {
  const r = rng(4), cols = ["#3EE0FF", "#FF5D73", "#FFB547", "#5BE49B", "#9B8CFF"];
  for (let i = 0; i < 16; i++) {
    const s = 60 + r() * 90, el = document.createElement("div");
    el.className = "abs";
    el.style.cssText = `left:${r() * 1920}px;top:${200 + r() * 900}px;width:${s}px;height:${s}px;border-radius:${s * 0.26}px;background:${cols[i % 5]};opacity:${(0.06 + r() * 0.1).toFixed(2)};filter:blur(${(r() * 3).toFixed(1)}px)`;
    $("#bokeh").appendChild(el);
    tl.fromTo(el, { y: 0, rotation: r() * 20 - 10 }, { y: -260 - r() * 200, rotation: r() * 40 - 20, duration: 5, ease: "none", immediateRender: false }, 0);
  }
})();
const HANDSET = (c, rot) => `<svg width="46" height="46" viewBox="0 0 24 24"><path transform="rotate(${rot} 12 12)" fill="${c}" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`;
const PX = 1150, PY = 140;
const me = EX.phoneBox("#s1in", { x: PX, y: PY, w: 300, accent: "#3EE0FF", id: "me" });
me.scr.innerHTML = `
  <div class="abs" style="inset:0;background:#0E1530">
    <div class="m" style="padding:30px 22px 14px;font-size:18px;color:#8A94B0">CONTACTS</div>
    ${[["MOM", "#FFB547"], ["PRIYA", "#FF5D73"], ["RAHUL", "#5BE49B"], ["SAM", "#9B8CFF"], ["ANU", "#3EE0FF"]].map(([n, c]) => `<div class="contact" ${n === "PRIYA" ? 'id="cPriya"' : ""}><div class="av" style="background:${c}">${n[0]}</div>${n[0] + n.slice(1).toLowerCase()}</div>`).join("")}
  </div>
  <div id="detail" class="abs" style="inset:0;background:#0E1530;display:flex;flex-direction:column;align-items:center;opacity:0">
    <div style="margin-top:90px;width:130px;height:130px;border-radius:50%;background:#FF5D73;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:800;font-size:60px;color:#0A0F1E">P</div>
    <div class="h" style="font-size:44px;margin-top:26px">Priya</div>
    <div class="m" style="font-size:18px;color:#8A94B0;margin-top:12px">MOBILE · USA</div>
    <div style="position:absolute;bottom:60px;width:96px;height:96px;border-radius:50%;background:#5BE49B;display:flex;align-items:center;justify-content:center">${HANDSET("#0A0F1E", 0)}</div>
  </div>
  <div id="calling" class="abs" style="inset:0;background:linear-gradient(180deg,#14204a,#0E1530);display:flex;flex-direction:column;align-items:center;opacity:0">
    <div id="callAv" style="margin-top:90px;width:130px;height:130px;border-radius:50%;background:#FF5D73;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:800;font-size:60px;color:#0A0F1E;box-shadow:0 0 0 0 rgba(255,93,115,.6)">P</div>
    <div class="h" style="font-size:44px;margin-top:26px">Priya</div>
    <div class="m" style="font-size:18px;color:#8A94B0;margin-top:12px">CALLING</div>
    <div style="position:absolute;bottom:60px;width:96px;height:96px;border-radius:50%;background:#FF5D73;display:flex;align-items:center;justify-content:center">${HANDSET("#fff", 135)}</div>
  </div>`;
tl.fromTo("#me", { y: 200, rotation: 8, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.8, ease: "back.out(1.4)", immediateRender: false }, 0.05);
sfx(0.05, "whoosh", { gain: 0.2, dur: 0.5 });
// kinetic words
gsap.set(["#kw1", "#kw2", "#kw3"], { autoAlpha: 0, x: -120 });
[["#kw1", w("open")], ["#kw2", w("tap")], ["#kw3", w("call", W.find("press"))]].forEach(([id, t], i, arr) => {
  tl.to(id, { autoAlpha: 1, x: 0, duration: 0.35, ease: "expo.out" }, t);
  sfx(t, "swish", { gain: 0.16 });
  if (i > 0) tl.to(arr[i - 1][0], { opacity: 0.22, duration: 0.3 }, t);
});
// the hand taps a name, then call
const hand = document.createElement("div");
hand.className = "abs";
hand.innerHTML = ART.hand({ w: 150 });
$("#s1in").appendChild(hand);
const NAME = [PX + 150, PY + 24.5 + 70 + 90 + 45], CALL = [PX + 150, PY + 24.5 + 566 - 60 - 48];
gsap.set(hand, { left: NAME[0] - 75, top: NAME[1], y: 700, rotation: -12, transformOrigin: "50% 0%" });
const tTap = w("name") + 0.05, tCall = w("call", W.find("press")) + 0.2;
tl.to(hand, { y: 0, rotation: -6, duration: 0.45, ease: "power3.out" }, tTap - 0.45);
tl.to(hand, { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1 }, tTap);
EX.tap("#s1in", NAME[0], NAME[1], tTap);
tl.to("#cPriya", { backgroundColor: "rgba(255,93,115,.2)", duration: 0.12 }, tTap);
tl.to("#detail", { opacity: 1, duration: 0.25 }, tTap + 0.3);
tl.to(hand, { top: CALL[1], duration: 0.45, ease: "power2.inOut" }, tCall - 0.5);
tl.to(hand, { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1 }, tCall);
EX.tap("#s1in", CALL[0], CALL[1], tCall);
tl.to("#calling", { opacity: 1, duration: 0.3 }, tCall + 0.1);
tl.to(hand, { y: 700, rotation: -20, duration: 0.5, ease: "power2.in" }, tCall + 0.25);
tl.to("#callAv", { keyframes: { boxShadow: ["0 0 0 0px rgba(255,93,115,.6)", "0 0 0 40px rgba(255,93,115,0)"] }, duration: 0.8, repeat: 1 }, tCall + 0.3);
tl.to("#s1in", { scale: 0.9, x: 120, duration: 0.5, ease: "power2.in" }, T.s2 - 0.15);

// ================================================= S2: two cities, one call
show("#s2", T.s2, T.s3 + 0.5);
$("#moon").innerHTML = ART.moon(130);
$("#skyN").innerHTML = ART.skyline({ w: 960, h: 460, seed: 11, color: "#0c1442", win: "#FFD27A", lit: 0.42, minH: 160, maxH: 400 });
$("#you").innerHTML = ART.caller({ w: 300, shirt: "#2a5bd7", id: "you" });
$("#sun").innerHTML = ART.sun(220);
$("#cl1").innerHTML = ART.cloud({ w: 300 });
$("#skyD").innerHTML = ART.skyline({ w: 960, h: 360, seed: 23, color: "#3b6aa8", win: "#cfe8ff", lit: 0.25, minH: 140, maxH: 340 });
(function () { const r = rng(9); for (let i = 0; i < 60; i++) $("#stars2").insertAdjacentHTML("beforeend", `<div class="abs" style="left:${r() * 960}px;top:${r() * 560}px;width:${2 + r() * 3}px;height:${2 + r() * 3}px;border-radius:50%;background:#fff;opacity:${(0.3 + r() * 0.7).toFixed(2)}"></div>`); })();
const fr = EX.phoneBox("#frBox", { x: 420, y: 330, w: 230, accent: "#FF5D73", id: "fr" });
fr.scr.innerHTML = `<div class="abs" style="inset:0;background:linear-gradient(180deg,#3a1630,#0E1530);display:flex;flex-direction:column;align-items:center">
  <div class="m" style="margin-top:56px;font-size:14px;color:#FF9BAA">INCOMING CALL</div>
  <div style="margin-top:34px;width:96px;height:96px;border-radius:50%;background:#3EE0FF;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:800;font-size:46px;color:#0A0F1E">Y</div>
  <div class="h" style="font-size:34px;margin-top:20px">You</div>
  <div style="position:absolute;bottom:40px;width:74px;height:74px;border-radius:50%;background:#5BE49B;display:flex;align-items:center;justify-content:center">${HANDSET("#0A0F1E", 0)}</div></div>`;
const frRings = document.createElement("div");
frRings.className = "abs"; frRings.style.cssText = "left:425px;top:190px";
frRings.innerHTML = SVG.arcs({ size: 220, color: "#FF5D73" });
$("#frBox").appendChild(frRings);
tl.fromTo("#night", { xPercent: -100 }, { xPercent: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, T.s2);
tl.fromTo("#day", { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, T.s2 + 0.25);
tl.fromTo("#divider", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, T.s2 + 0.5);
sfx(T.s2, "whoosh", { gain: 0.26, dur: 0.5 });
sfx(T.s2 + 0.25, "whoosh", { gain: 0.22, dur: 0.5 });
tl.fromTo("#you", { y: 120 }, { y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, T.s2 + 0.15);
for (let k = 0; k < 8; k++) tl.to("#youMouth", { ry: k % 2 ? 6 : 12, duration: 0.12 }, T.s2 + 0.4 + k * 0.13);
tl.fromTo("#sun .rays", { rotation: 0, transformOrigin: "0 0" }, { rotation: 40, duration: 4, ease: "none", immediateRender: false }, T.s2);
tl.fromTo("#cl1", { x: 0 }, { x: -120, duration: 4, ease: "none", immediateRender: false }, T.s2);
draw("#farPath", T.s2 + 0.8, 0.9);
gsap.set("#farChip", { autoAlpha: 0 });
pop("#farChip", T.s2 + 1.4);
const tRing = w("rings");
for (let k = 0; k < 10; k++) tl.to("#fr", { rotation: k % 2 ? -4 : 4, duration: 0.06 }, tRing + k * 0.06);
tl.to("#fr", { rotation: 0, duration: 0.06 }, tRing + 0.6);
[0, 0.6].forEach((o) => { sfx(tRing + o, "beep", { gain: 0.15, pitch: 0.75 }); sfx(tRing + o + 0.14, "beep", { gain: 0.15, pitch: 0.85 }); });
EX.pulseArcs(frRings, tRing, T.s3, 0.65);
gsap.set("#otherSide span, #otherSide .serif", { autoAlpha: 0, y: 40 });
["other", "side"].forEach((wd, i) => tl.to($$("#otherSide span")[i + 1], { autoAlpha: 1, y: 0, duration: 0.25, ease: "expo.out" }, W(W.find(wd, W.find("rings")))));
tl.to($$("#otherSide span")[0], { autoAlpha: 1, y: 0, duration: 0.25, ease: "expo.out" }, w("the other") );
tl.to("#otherSide .serif", { autoAlpha: 1, y: 0, duration: 0.35, ease: "expo.out" }, w("planet"));
sfx(w("other side"), "slam", { gain: 0.22 });
// zoom out into space
tl.to(["#night", "#day", "#divider", "#farPath", "#farChip", "#otherSide"], { scale: 0.4, autoAlpha: 0, duration: 0.55, ease: "power3.in", transformOrigin: "50% 50%" }, T.s3 - 0.3);

// ================================================= S3: the globe in space
show("#s3", T.s3 - 0.1, T.s4a + 0.4, { scale: 1.4 });
sfx(T.s3 - 0.1, "whoosh", { gain: 0.3, dur: 0.8 });
(function () {
  const c = $("#stars").getContext("2d"), r = rng(31);
  const S = Array.from({ length: 260 }, () => ({ x: r() * 1920, y: r() * 1080, s: 0.6 + r() * 2.2, ph: r() * 6, sp: 1 + r() * 3 }));
  REEL.onFrame((t) => {
    c.clearRect(0, 0, 1920, 1080);
    if (t < T.s3 - 0.2 || t > T.s4a + 0.5) return;
    for (const p of S) { c.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(p.ph + t * p.sp)); c.fillStyle = "#fff"; c.fillRect(p.x - (t - T.s3) * 12 * p.s, p.y, p.s, p.s); }
    c.globalAlpha = 1;
  });
})();
const cv = $("#globe"), ctx = cv.getContext("2d");
const IN = [72.9, 19.1], US = [-74.0, 40.7];
const proj = d3.geoOrthographic().scale(440).translate([760, 540]).clipAngle(90);
const path = d3.geoPath(proj, ctx);
const grat = d3.geoGraticule10();
