<!doctype html>
<html><head><meta charset="utf-8"><title>UPI Ch7 The big picture</title>
<link rel="stylesheet" href="../../../lib/fonts.css">

<script src="../../../lib/vendor/gsap.min.js"></script>

<script src="../../../lib/vendor/SplitText.min.js"></script>

<script src="../../../lib/paper.js"></script><script src="../../../lib/cast.js"></script><script src="../../../lib/iso.js"></script><script src="../../../lib/explainer2.js"></script>
</head><body>
<div id="shake"><div id="bgfx"></div><div id="stage">

  <section class="scene" id="sA">
    <div class="bg" style="background:linear-gradient(180deg,#ECE6FC 0%,#DFD6F8 100%)"></div><div class="abs" style="left:0;top:700px;width:1920px;height:380px;background:repeating-linear-gradient(90deg,#CDBFF0 0 158px,#C4B5EC 158px 160px)"></div>
    <div class="serif" id="rem" data-ob="rem" style="position:absolute;left:116px;top:100px;font-size:84px;color:#1B2340">remember:</div>
    <div id="mApp" class="abs" data-ob="m1" style="left:300px;top:380px"></div>
    <div id="mB1" class="abs" data-ob="m2" style="left:440px;top:330px"></div>
    <div id="mRef" class="abs" data-ob="m3" style="left:830px;top:290px"></div>
    <div id="mB2" class="abs" data-ob="m4" style="left:1095px;top:330px"></div>
    <div id="tableA" class="abs" style="left:0;top:0"></div>
    <div id="tChai" class="abs" data-ob="tchai" style="left:915px;top:640px"></div>
    <div id="spot" class="abs" style="left:1420px;top:300px;width:460px;height:520px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,220,150,.5) 0%,rgba(255,220,150,0) 70%);opacity:0"></div>
    <div id="you" class="abs" data-ob="you" style="left:1520px;top:380px"></div>
    <svg id="crown" class="abs" data-ob="you" style="left:1580px;top:300px" width="140" height="90" viewBox="0 0 140 90"><path d="M10 80 L20 20 L50 50 L70 10 L90 50 L120 20 L130 80 Z" fill="#FFB547" stroke="#c98a1a" stroke-width="4"/></svg>
    <div class="chip" id="twoSec" data-ob="twosec" style="left:660px;top:860px;color:#B9770E;font-size:28px">A 2-SECOND MEETING, ALL ABOUT YOU</div>
  </section>

  <section class="scene" id="sB">
    <div class="bg" style="background:linear-gradient(180deg,#3B4A8C 0%,#5A6BB0 100%)"></div><div id="cityN" class="abs" style="left:0;top:640px"></div>
    <canvas id="swarm" class="abs" width="1920" height="1080" style="left:0;top:0"></canvas>
    <div class="lbl x3d" id="bil" data-ob="bil" style="left:110px;top:120px;font-size:170px;--xf:#fff;--xs:#1B2340">Billions</div>
    <div class="serif" id="bilSub" data-ob="bilsub" style="position:absolute;left:116px;top:290px;font-size:70px;color:#BDEBFF">of payments, every single month</div>
    <div class="pcard" id="ppl" data-ob="ppl" style="left:1100px;top:620px;width:700px"><div class="tape"></div><div class="m" style="font-size:20px;color:#8a7f6a">THAT'S HOW</div><div class="h" style="font-size:52px;margin-top:6px">a billion+ people buy their chai</div></div>
  </section>

  <section class="scene" id="sC">
    <div class="bg" style="background:linear-gradient(180deg,#CFEAFB 0%,#EAF6FD 70%)"></div><div id="cloudsC" class="abs" style="inset:0"></div><div class="abs" style="left:0;top:860px;width:1920px;height:220px;background:#D9F0DF"></div>
    <div id="host" class="abs" data-ob="host" style="left:140px;top:300px"></div>
    <div id="hcup" class="abs" data-ob="host" style="left:560px;top:460px"></div>
    <div class="lbl x3d" id="cold" data-ob="cold" style="left:760px;top:140px;font-size:120px;--xf:#fff">Your chai's<br><span style="color:#12A4C4">getting cold</span></div>
    <div class="serif" id="drink" data-ob="drink" style="position:absolute;left:770px;top:370px;font-size:80px;color:#1B2340">go drink it.</div>
    <div id="jar" class="abs" data-ob="jar" style="left:1180px;top:520px;width:220px;height:260px;border-radius:30px 30px 40px 40px;background:rgba(255,255,255,.7);border:6px solid #1B2340"><div class="abs m" style="left:0;right:0;top:110px;text-align:center;font-size:30px;color:#1B2340">TIPS</div></div>
    <div id="tcoin" class="abs" style="left:1260px;top:380px;width:60px;height:60px;border-radius:50%;background:#FFB547;border:5px solid #c98a1a;opacity:0"></div>
    <div id="qrMini" class="abs" data-ob="qrmini" style="left:1500px;top:480px;padding:16px;border-radius:20px;background:#fff;box-shadow:12px 12px 0 #B9C6E0"></div>
    <div class="serif" id="obv" data-ob="obv" style="position:absolute;left:1470px;top:770px;font-size:70px;color:#1B2340">obviously.</div>
  </section>

  <section class="scene" id="sEnd">
    <div class="bg" style="background:radial-gradient(ellipse at 50% 40%,#FFFFFF 0%,#DDEBFB 60%,#C9DCF7 100%)"></div><div id="cityE" class="abs" style="left:0;top:560px;opacity:.7"></div><div id="coinsE" class="abs" style="inset:0"></div>
    <div class="abs" style="left:0;right:0;top:200px;text-align:center">
      <div class="m" id="e1" data-ob="e1" style="display:inline-block;font-size:26px;letter-spacing:.34em;color:#12A4C4">HOW IT WORKS</div><br>
      <div class="big x3d" id="e2" data-ob="e2" style="display:inline-block;font-size:130px;margin-top:22px;--xf:#fff">How <span style="color:#12A4C4">UPI</span> works</div><br>
      <div class="serif" id="e3" data-ob="e3" style="display:inline-block;font-size:84px;margin-top:30px;color:#E0324B">Thanks for watching</div><br>
      <div class="serif" id="e4" data-ob="e4" style="display:inline-block;font-size:44px;margin-top:24px;color:#3B4466">Got a scary payment failed story? Tell us in the comments.</div>
    </div>
    <div id="eRoad" class="abs" data-ob="eroad" style="left:0;right:0;top:800px;display:flex;justify-content:center;gap:12px"></div>
  </section>

</div></div>
<script>
const { tl, W, sfx, rng } = REEL;
const { $, $$, w, we, show, every, pop, rise, fade, draw, SVG } = EX;
const { ART } = PAPER;
EX.chrome(7, 7, "The big picture");
$("#subs").dataset.ob = "subs";
EX.subtitles();
EX.chapterCard2(7, "The big picture", 0.05, 2.3, { hero: `<div class="abs" style="left:0;top:330px">${ISO.city({ w: 780, h: 380, color: "#9EE0BE", seed: 4 })}</div><div class="abs" style="left:200px;top:60px">${ISO.bank({ w: 380, color: "#22B573", id: "hb7", label: "UPI" })}</div><div class="abs" id="hc1" style="left:40px;top:120px">${ISO.coin({ size: 110 })}</div><div class="abs" id="hc2" style="left:620px;top:80px">${ISO.coin({ size: 130 })}</div>`, heroAnim: (el, t) => tl.fromTo(["#hc1", "#hc2"], { y: 40 }, { y: -30, duration: 1.4, ease: "sine.inOut", stagger: 0.2, immediateRender: false }, t) });
const END = W.last() + 5.0;
const T = { A: 2.2, B: w("now multiply") - 0.1, C: w("anyway") - 0.1, E: W.last() + 0.8 };

// ================================================= A: the 2-second meeting, all about you
show("#sA", T.A, null, { y: 0 });
$("#mApp").innerHTML = `<div style="position:relative;width:140px;height:290px">${ISO.phone({ w: 140 })}<svg class="abs" style="left:10px;top:12px" width="120" height="260" viewBox="0 0 120 260"><circle cx="40" cy="110" r="11" fill="#fff"/><circle cx="80" cy="110" r="11" fill="#fff"/><path d="M42 150 Q60 164 78 150" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>`;
$("#tableA").innerHTML = `<svg width="1920" height="1080" style="overflow:visible">${ISO.shadow(980, 900, 760, 60, 0.2)}${ISO.box(260, 700, 0, 1180, 90, 140, "#9A6A45")}<rect x="300" y="790" width="30" height="120" fill="#7A4F31"/><rect x="1380" y="790" width="30" height="120" fill="#7A4F31"/></svg>`;
$("#mB1").innerHTML = ISO.bank({ w: 380, color: "#3E7BFA", id: "a1", label: "YOUR BANK" });
$("#mRef").innerHTML = ART.referee({ w: 250, id: "ar" });
$("#mB2").innerHTML = ISO.bank({ w: 380, color: "#F5A524", id: "a2", label: "CHAI WALA'S" });
$("#you").innerHTML = ART.you({ w: 260, id: "yo", shirt: "#3E7BFA" });
gsap.set(["#rem", "#mApp", "#mB1", "#mRef", "#mB2", "#you", "#crown", "#twoSec"], { autoAlpha: 0 });
$("#tChai").innerHTML = ART.chai({ w: 100, id: "tc" });
gsap.set("#tChai", { autoAlpha: 0 });
pop("#tChai", w("pay for chai"), { from: 0.3, sfx: "pop" });
every(w("pay for chai"), T.B, 0.6, (t) => tl.fromTo("#tcSteam", { y: 0, opacity: 0.9 }, { y: -18, opacity: 0, duration: 0.6, ease: "none", immediateRender: false }, t));
rise("#rem", w("remember"));
pop("#mApp", w("an app"), { from: 0.4 }); pop("#mB1", w("two banks"), { from: 0.4 }); pop("#mB2", w("two banks") + 0.15, { from: 0.4 }); pop("#mRef", w("a referee"), { from: 0.4 });
pop("#twoSec", w("two second"), { sfx: "chime", gain: 0.16 });
pop("#you", w("all about"), { from: 0.5 });
tl.to("#spot", { opacity: 1, duration: 0.3 }, w("all about"));
tl.fromTo("#crown", { autoAlpha: 1, y: -200, rotation: -20 }, { y: 0, rotation: 0, duration: 0.4, ease: "bounce.out", immediateRender: false }, w("about you"));
sfx(w("about you") + 0.3, "ding", { gain: 0.2 });
tl.to("#sA .pupil", { x: 6, duration: 0.2 }, w("all about"));

// ================================================= B: billions (page fold)
EX.dive("#sA", "#sB", T.B, 1590, 540);
gsap.set("#sB", { autoAlpha: 0 });
$("#cityN").innerHTML = ISO.city({ h: 440, color: "#2E3A72", seed: 9 });
$$("#cityN rect").forEach((r, i) => { if (r.getAttribute("width") === "14") r.setAttribute("fill", i % 3 ? "#FFD86B" : "#8FA3E6"); });
gsap.set(["#bil", "#bilSub", "#ppl"], { autoAlpha: 0 });
tl.fromTo("#bil", { autoAlpha: 0, scale: 1.3 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, w("billions"));
sfx(w("billions"), "riser", { gain: 0.14, dur: 1.4 });
rise("#bilSub", w("every single"));
tl.fromTo("#ppl", { autoAlpha: 0, rotation: 5, y: 60 }, { autoAlpha: 1, rotation: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, w("that's how"));
sfx(w("that's how"), "paper", { gain: 0.25 });
(function () {
  const c = $("#swarm").getContext("2d"), r = rng(12), N = 2600;
  const P = Array.from({ length: N }, (_, i) => ({ x: r() * 1920, y: 380 + r() * 300, b: Math.pow(i / N, 0.5) * 3.2, c: ["#3EE0FF", "#FFB547", "#5BE49B", "#9B8CFF"][i % 4], s: 2 + r() * 4, ph: r() * 6 }));
  const t0 = w("by billions") - 0.2;
  REEL.onFrame((t) => {
    c.clearRect(0, 0, 1920, 1080);
    if (t < T.B || t > T.C + 0.6) return;
    for (const p of P) { if (t - t0 < p.b) continue; const a = Math.min(1, (t - t0 - p.b) * 4); c.globalAlpha = a * (0.5 + 0.5 * Math.abs(Math.sin(t * 3 + p.ph))); c.fillStyle = p.c; c.fillRect(p.x, p.y, p.s, p.s); }
    c.globalAlpha = 1;
  });
  every(t0, t0 + 3, 0.08, (t) => sfx(t, "tick", { gain: 0.04 }));
})();

// ================================================= C: your chai's getting cold (paper rip)
EX.iris("#sC", T.C, 960, 540, { color: "#12A4C4" });
show("#sC", T.C, null, { y: 0 });
tl.set("#sB", { autoAlpha: 0 }, T.C);
(function () { const r = rng(17); for (let i = 0; i < 4; i++) { const el = document.createElement("div"); el.className = "abs"; el.style.cssText = `left:${200 + r() * 1500}px;top:${40 + r() * 60}px`; el.innerHTML = ISO.cloud({ w: 200 + r() * 120 }); $("#cloudsC").appendChild(el); } })();
$("#host").innerHTML = ART.host({ w: 360, id: "h" });
$("#hcup").innerHTML = ART.chai({ w: 110, id: "hc" });
$("#qrMini").innerHTML = ART.qr({ size: 200, seed: 21 });
gsap.set(["#host", "#hcup", "#cold", "#drink", "#jar", "#qrMini", "#obv"], { autoAlpha: 0 });
tl.fromTo(["#host", "#hcup"], { autoAlpha: 1, x: -500 }, { x: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, T.C + 0.4);
PAPER.lipSync($("#hMouth"), { from: T.C + 0.4, open: 18 });
PAPER.blink($("#hEyes"), [T.C + 1.6, w("through upi") + 0.5]);
every(T.C, w("go drink"), 0.5, (t) => tl.fromTo("#hcSteam", { y: 0, opacity: 0.9 }, { y: -22, opacity: 0, duration: 0.5, ease: "none", immediateRender: false }, t));
tl.to("#hcSteam", { opacity: 0, duration: 0.2 }, w("go drink"));
tl.fromTo("#cold", { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, w("your chai's"));
sfx(w("your chai's"), "swish", { gain: 0.2 });
rise("#drink", w("go drink"));
pop("#jar", w("maybe tip") - 0.2, { from: 0.6, sfx: false });
tl.fromTo("#tcoin", { opacity: 1, y: -60, rotation: 0 }, { y: 200, rotation: 540, duration: 0.6, ease: "power2.in", immediateRender: false }, w("tip the"));
tl.set("#tcoin", { opacity: 0 }, w("tip the") + 0.6);
sfx(w("tip the") + 0.55, "coin", { gain: 0.3 });
pop("#qrMini", w("through upi"), { from: 0.5, sfx: "pop" });
tl.fromTo("#obv", { autoAlpha: 0, scale: 1.3, rotation: -6 }, { autoAlpha: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2)", immediateRender: false }, w("obviously"));
sfx(w("obviously"), "chime", { gain: 0.2 });
tl.to("#hBrowL", { y: -10, duration: 0.15 }, w("obviously"));

// ================================================= End card (page fold)
EX.stripes(T.E);
show("#sEnd", T.E, null, { y: 0 });
tl.set("#sC", { autoAlpha: 0 }, T.E);
$("#cityE").innerHTML = ISO.city({ h: 520, color: "#BCD2F2", seed: 5 });
[[140, 160, 90], [1700, 140, 110], [260, 600, 70], [1620, 560, 80]].forEach(([x, y, z], i) => { const el = document.createElement("div"); el.className = "abs"; el.style.cssText = `left:${x}px;top:${y}px`; el.innerHTML = ISO.coin({ size: z }); $("#coinsE").appendChild(el); tl.fromTo(el, { autoAlpha: 0, scale: 0.3 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, T.E + 0.6 + i * 0.1); tl.to(el, { y: -24, rotation: 20, duration: 1.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.E + 1); });
tl.to(["#tag", "#prog"], { autoAlpha: 0, duration: 0.3 }, T.E);
gsap.set(["#e1", "#e2", "#e3", "#e4"], { autoAlpha: 0 });
const tE = T.E + 0.4;
rise("#e1", tE + 0.1); rise("#e2", tE + 0.3, { y: 50 }); rise("#e3", tE + 0.8); rise("#e4", tE + 1.4);
sfx(tE + 0.3, "chime", { gain: 0.2 });
const CH = ["The ₹10 chai", "Meet the gang", "The 2-second journey", "The PIN", "Why is it free?", "Debited but failed", "The big picture"];
$("#eRoad").innerHTML = CH.map((c) => `<div class="pill"><b>✓</b>${c}</div>`).join("");
$$("#eRoad .pill").forEach((p, i) => { gsap.set(p, { autoAlpha: 0, y: 20 }); tl.to(p, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, tE + 1.8 + i * 0.1); });

REEL.finish(END);
</script>
</body></html>
